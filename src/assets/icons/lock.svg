<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">

    <defs>

        <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">

            <stop offset="0%" stop-color="#00C2FF"></stop>
            <stop offset="45%" stop-color="#5B7CFF"></stop>
            <stop offset="100%" stop-color="#FF2D95"></stop>

        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
            <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>

    </defs>

    <!-- Arco -->

    <path filter="url(#glow)" d="
            M40 54
            V42
            C40 28 50 18 64 18
            C78 18 88 28 88 42
            V54
        " stroke="url(#lockGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Cuerpo -->

    <rect x="30" y="54" width="68" height="56" rx="10" stroke="url(#lockGradient)" stroke-width="6" filter="url(#glow)"></rect>

    <!-- Cerradura -->

    <circle cx="64" cy="78" r="5" fill="url(#lockGradient)" filter="url(#glow)"></circle>

    <path d="
            M64 83
            V94
        " stroke="url(#lockGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"></path>

</svg>